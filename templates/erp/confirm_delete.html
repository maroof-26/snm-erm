{% extends "base.html" %}
{% block content %}
<div class="card card-body" style="max-width:520px">
  <h1 class="h5">Delete "{{ object }}"?</h1>
  <p class="text-muted">This cannot be undone.</p>
  <form method="post" class="d-flex gap-2">{% csrf_token %}
    <button class="btn btn-danger">Delete</button>
    <a class="btn btn-outline-secondary" href="{% if cancel_pk %}{% url cancel_url cancel_pk %}{% else %}{% url cancel_url %}{% endif %}">Cancel</a>
  </form>
</div>
{% endblock %}
