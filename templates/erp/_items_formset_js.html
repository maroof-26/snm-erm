{# Shared by the invoice and order forms: add / remove rows, live total, product -> rate & unit. #}
<script>
const products = {{ products_json|safe }};
const rows = document.getElementById('rows'), total = document.getElementById('total');
const count = document.getElementById('id_items-TOTAL_FORMS');
const num = v => parseFloat((v || '').replace(/,/g, '')) || 0;
function recalc() {
  let t = 0;
  rows.querySelectorAll('.item-row').forEach(r => {
    if (r.querySelector('[name$="-DELETE"]:checked')) return;
    t += num(r.querySelector('[name$="-quantity"]').value) * num(r.querySelector('[name$="-rate"]').value);
  });
  const disc = document.getElementById('id_discount'); if (disc) t = Math.max(t - num(disc.value), 0);
  window.grandTotal = t;
  total.textContent = t.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
}
const liveRows = () => [...rows.querySelectorAll('.item-row')].filter(r => !r.classList.contains('d-none'));
function syncRemoveButtons() {
  const many = liveRows().length > 1;
  rows.querySelectorAll('.item-remove').forEach(b => { b.style.display = many ? '' : 'none'; });
}
rows.addEventListener('click', e => {
  const btn = e.target.closest('.item-remove'); if (!btn) return;
  const row = btn.closest('.item-row');
  row.querySelector('.item-del').checked = true; row.classList.add('d-none');
  recalc(); syncRemoveButtons();
});
rows.addEventListener('input', recalc);
const discEl = document.getElementById('id_discount'); if (discEl) discEl.addEventListener('input', recalc);
rows.addEventListener('change', e => {
  const row = e.target.closest('.item-row');
  if (e.target.name && e.target.name.endsWith('-product') && products[e.target.value]) {
    row.querySelector('[name$="-rate"]').value = products[e.target.value].rate.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    row.querySelector('[name$="-unit"]').value = products[e.target.value].unit;
  }
  recalc();
});
document.getElementById('add').onclick = () => {
  const html = document.getElementById('empty').innerHTML.replaceAll('__prefix__', count.value);
  rows.insertAdjacentHTML('beforeend', html);
  count.value = parseInt(count.value) + 1;
  syncRemoveButtons();
};
const full = document.getElementById('full');
if (full) full.onclick = () => { document.getElementById('id_paid_now').value = (window.grandTotal || 0).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}); };
recalc(); syncRemoveButtons();
</script>
